profile:
  show: true
  order: 1
  title: プロフィール
  description: |
    製造業、フィンテック、エンタープライズ領域で C#/.NET と SQL Server を用いた業務 Web システム開発に 6年以上従事してきたシニアソフトウェアエンジニア。
    - ASP.NET/.NET Core、アプリケーションサービス開発、データベース設計、SQL パフォーマンスチューニングに強みを持つバックエンド志向のエンジニア。
    - 直近のプロジェクトでは Angular/TypeScript 開発にも領域を広げ、業務 Web アプリケーション向けのダッシュボードおよびレポート機能を実装。
    - Azure 認定資格を保有し、Azure DevOps ワークフローや個人での Azure ベースのデプロイ経験を有する。

experience:
  show: true
  order: 2
  title: 職務経歴
  items:
    - role: シニアアナリスト / バックエンド開発者
      company: Avanade Inc.
      date: "2023年12月 - 現在"
      location: 東京, 日本
      tags: 正社員
      description: |
        - **半導体メーカー向け社内データ分析プラットフォーム (2024年11月 - 現在)**
          - データ処理、ETL ワークフロー、ダッシュボード、レポーティングを担う製造分析向けの社内プラットフォーム。
          - .NET Core, EF Core, Angular, SQL Server
          - 6〜20名体制、約11.5万 LOC、ダッシュボード 18 ページ、API 44 本
          - Angular でダッシュボード画面を構築し、C# のアプリケーションサービスを実装。ETL・データ処理ワークフローを支援しつつ、インデックス設計と実行計画最適化により SQL Server の集計中心クエリをチューニング。
        - **エンタープライズシステム設計・デジタルトランスフォーメーションプロジェクト (2024年4月 - 2024年10月)**
          - Excel で手作業運用されていた複雑な顧客業務を Web システム化した上流設計案件。
          - 要件分析、システム設計、データベース設計、アプリケーションサービス設計、ウォーターフォール開発
          - 6〜20名体制、オフショア開発チームと協業、100 以上の画面、50 以上のデータベーススキーマ
          - 複雑な顧客要件と Excel ベースの業務フローを実用的な Web システムに落とし込み、要件分析と上流設計を主導。DB スキーマ、アプリケーションサービス仕様、画面設計を定義し、オフショア開発チームの進捗管理も担当。

    - role: ソフトウェアエンジニア
      company: Growth & Communications Inc.
      date: "2021年10月 - 2023年11月"
      location: 東京, 日本
      tags: 正社員
      description: |
        - **中古車取引・輸出プラットフォーム開発・保守 (2023年1月 - 2023年11月)**:
          - 10年以上稼働しているレガシー Web プラットフォームの新機能開発と保守を担当。
          - ASP.NET, .NET Framework, SQL Server, Redis, Jenkins, GCP
          - 5名体制、100万以上の登録ユーザーを持つ長期運用プロダクト
          - 新規ページの設計・開発、既存機能の改善、自動テストおよびデプロイフローの運用を担当。
        - **金融投資分析システム バックエンド再構築 (2022年5月 - 2022年12月)**:
          - レガシーな金融投資情報バックエンドシステムの再構築プロジェクト。
          - ASP.NET, .NET Framework, SQL Server, VBA, GAS
          - 3名体制、API 20 本以上
          - 既存機能の移行・再構築に加え、C# と Google Apps Script を用いた自動テストツールを作成し、テスト支援と手動検証工数の削減に貢献。
        - **銀行システム OTP 開発 (2021年10月 - 2022年3月)**:
          - 大手銀行システム向け OTP 認証機能の開発。
          - ASP.NET, .NET Framework, JavaScript, Oracle DB
          - 5名体制、5画面
          - セキュリティ要件の厳しい銀行システムにおいて、OTP 認証機能を開発し、厳格なセキュリティおよび品質基準のもとで変更を提供。

    - role: ソフトウェアエンジニア
      company: W2 Solution Co., Ltd.
      date: "2020年12月 - 2021年9月"
      location: 東京, 日本
      tags: 正社員
      description: |
        - **E コマース製品開発 (2020年12月 - 2021年8月)**:
          - オンラインストア立ち上げ向けの自社 EC プラットフォームで、標準製品と顧客別カスタマイズ版の両方を提供。
          - ASP.NET, C#, .NET Framework, SQL Server
          - カスタマイズ製品チーム 3名、標準製品チーム 20名、顧客別カスタマイズ版 20 以上
          - 主に顧客向けカスタマイズ版の新機能開発と不具合修正を担当しつつ、標準製品の機能開発・保守にも参画。

    - role: ジュニアソフトウェアエンジニア
      company: AVAIL Corporation
      date: "2019年8月 - 2020年11月"
      location: 東京, 日本
      tags: 正社員
      description: |
        - **アパレル管理システム開発 (2019年8月 - 2020年11月)**:
          - アパレル業務向け基幹システムの保守・カスタマイズ。
          - VB.NET, C#, SQL
          - 2名体制
          - データ不具合の根本原因分析を行い、SQL クエリを最適化してシステムの安定性と保守性を向上。

